<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <title>$title</title>
  <link rel="icon" type="image/svg+xml" href="$root/assets/favicon.svg">
  <link rel="stylesheet" href="$root/assets/site.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="$root/">$name</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="$root/"$about_current>About</a>
        <a href="$root/publications/"$publications_current>Publications</a>
        <a href="$root/cv/"$cv_current>CV</a>
      </nav>
    </div>
  </header>
  <div class="site-shell">
    <aside class="profile" aria-label="Profile">
      $portrait
      <div class="profile-details">
        <h2 class="profile-name">$name</h2>
        <p class="profile-role">$role</p>
        <p class="profile-affiliation"><a href="$institution_url">$institution</a><br><a href="$institute_url">$institute_short</a></p>
        <ul class="profile-links">
          <li>$location_icon<span>$location</span></li>
          <li>$email_icon<a href="mailto:$email">$email</a></li>
          <li>$group_icon<a href="$group_url">$group group</a></li>
        </ul>
      </div>
    </aside>
    <main class="content" id="main-content" tabindex="-1">
      $content
    </main>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>© $year $name</span>
      <a href="mailto:$email">Contact</a>
    </div>
  </footer>
</body>
</html>
